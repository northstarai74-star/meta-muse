# Optional local PostgreSQL for development. Skip this file if you installed PostgreSQL natively.
#   docker compose up -d        # start
#   docker compose down         # stop (data is kept in the volume)
# Credentials match the DATABASE_URL in .env.example's local example:
#   postgresql://muse:muse@localhost:5432/muse
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse
    ports:
      - "5432:5432"
    volumes:
      - muse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse -d muse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  muse-pgdata:
